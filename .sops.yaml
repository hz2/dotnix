# recipients for secrets/*.yaml
#   hz2: ssh-to-age < ~/.ssh/id_ed25519.pub on the laptop (same key agenix used)
#   after adding a recipient: sops updatekeys secrets/<host>.yaml
keys:
  - &hz2 age1esyveu0pnn9wtjyvysu6e44nz4k279jqhxhwgdx7kcrwnlxtvvys2ay3a0
creation_rules:
  - path_regex: secrets/hz2\.yaml$
    key_groups:
      - age:
          - *hz2
